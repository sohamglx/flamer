[package]
name = "flamer_server"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
axum = "0.8.9"
flame-macro = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
http-body-util = "0.1"
bytes = "1"


[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1